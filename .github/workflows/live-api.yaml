# Live API tests. Each run makes paid calls (a few tiny ones per provider).
# For this reason the workflow starts only by hand (Actions tab, "Run
# workflow"), never on a push. ellmer runs its live tests on each push; fmm
# decides later whether to do the same.
#
# Before the first run, add these repository secrets (Settings, Secrets and
# variables, Actions):
#   TYPESAFE_API_KEY
#   OPENAI_API_KEY
#   OPENROUTER_API_KEY
on:
  workflow_dispatch:

name: live-api.yaml

permissions: read-all

jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::devtools
          needs: check

      # The keys reach only this step, so the setup actions never see them.
      - name: Run the live tests
        env:
          DECISIONS_LIVE_TESTS: true
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: devtools::test(filter = "live")
        shell: Rscript {0}
